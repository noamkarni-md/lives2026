 const rooms=[...new Set(L.map(x=>x[3]))].sort((a,b)=>rk(a)-rk(b));
 const t0=Math.floor(Math.min(...L.map(x=>mn(x[1])))/60)*60,t1=Math.ceil(Math.max(...L.map(x=>mn(x[2])))/60)*60,H=(t1-t0)*ppm;
 let tc='<div class="gt"><div class="gh"></div><div style="position:relative;height:'+H+'px">';
 for(let m=t0;m<t1;m+=60)tc+='<div class="gl" style="top:'+(m-t0)*ppm+'px">'+hm(m)+"</div>";
 tc+="</div></div>";let cols="";
 rooms.forEach(r=>{const A=L.filter(x=>x[3]==r).sort((a,b)=>mn(a[1])-mn(b[1]));const ends=[],P=[];
  A.forEach(x=>{let k=ends.findIndex(e=>e<=mn(x[1]));if(k<0){k=ends.length;ends.push(0)}ends[k]=mn(x[2]);P.push([x,k])});
  const n=ends.length;
  cols+='<div class="gc" style="width:'+cw*n+'px"><div class="gh">'+E(r)+'</div><div style="position:relative;height:'+H+'px;background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px '+60*ppm+'px)">'+P.map(([x,k])=>{const i=id(x);const hh=Math.max(14,(mn(x[2])-mn(x[1]))*ppm-2);
   return '<div class="gb'+(fav.has(i)?" fav":"")+(sel==i?" sel":"")+'" data-i="'+E(i)+'" style="top:'+((mn(x[1])-t0)*ppm+1)+'px;height:'+hh+'px;left:'+k*cw+'px;width:'+(cw-3)+'px;background:'+(TC[x[4]]||"#888")+'">'+(hh>26?"<b>"+x[1]+"</b> ":"")+E(x[5])+"</div>"}).join("")+"</div></div>"});
 return '<div id="gw"><div id="gi">'+tc+cols+"</div></div>"}

 ap();

 document.getElementById("rg").value=tm;document.getElementById("tl").textContent=hm(tm);

 chips(document.getElementById("types"),TY.map(k=>[k,TN[k]]),k=>!hide.has(k),k=>hide.has(k)?hide.delete(k):hide.add(k));

 if(tp)L=L.filter(x=>TOP[tp].test(x[5]));
 if(qq){const q=qq.toLowerCase();L=L.filter(x=>(x.slice(3,6).join(" ")+x[6].join(" ")+x[7].join(" ")).toLowerCase().includes(q))}

   A.forEach(x=>{const c=A.filter(y=>y!==x&&ov(x,y));h+=card(x,c.length?'<div class="cf2">'+T(18)+' '+c.map(y=>E(y[5].slice(0,45))+" ("+y[1]+"–"+y[2]+")").join("; ")+"</div>":"")})})}
 else if(view=="t"){L=L.filter(x=>mn(x[1])<=tm&&tm<mn(x[2]));

 else{const g={};L.forEach(x=>(g[x[1]]=g[x[1]]||[]).push(x));

  Object.keys(g).sort().forEach(k=>{h+="<h2>"+k+"<small>"+T(13,{n:g[k].length})+"</small></h2>";g[k].forEach(x=>{const n=L.filter(y=>y!==x&&ov(x,y)).length;h+=card(x,'<div class="ln">'+T(17,{n:n})+"</div>")})})}
 el.innerHTML=h;
 const gw=document.getElementById("gw");if(gw){gw.style.height=Math.max(260,innerHeight-document.querySelector("header").offsetHeight-(sel?170:20))+"px";gw.scrollLeft=sl;gw.scrollTop=stp;gw.querySelectorAll(".gb").forEach(b=>b.onclick=()=>{sel=b.dataset.i;draw()})}

 el.querySelectorAll(".st").forEach(b=>b.onclick=()=>{const i=b.dataset.i;fav.has(i)?fav.delete(i):fav.add(i);sv();draw()});
}
